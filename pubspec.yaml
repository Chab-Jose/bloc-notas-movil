name: blog_note_android
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2        # ← movido aquí
  sqflite: ^2.3.3         # ← movido aquí
  path: ^1.9.0            # ← movido aquí
  intl: ^0.19.0           # ← movido aquí
  flutter_speed_dial: ^7.0.0
